name: anthropic-wif-test
on:    
  push:
      branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_019GYXWSqnXFLFBkG95tFMoB",
            "organization_id": "fe679033-d7d7-4657-b606-c4fc51be726e",
            "service_account_id": "svac_01Tt8tPb8rqvahzLqxwAVTuY",
            "workspace_id": "wrkspc_01CFUptY7CByEfcE8TfYMXXF"
          }
          JSON
